<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="CodeField: one-time-code and PIN input for SwiftUI" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#132a3a"/>
    </linearGradient>
    <radialGradient id="blob1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="560" fill="url(#bg)"/>
  <circle cx="900" cy="160" r="220" fill="url(#blob1)" filter="url(#blur)"/>
  <circle cx="1130" cy="430" r="200" fill="url(#blob2)" filter="url(#blur)"/>

  <g font-family="-apple-system, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="80" y="235" fill="#ffffff" font-size="76" font-weight="800" letter-spacing="-2">CodeField</text>
    <text x="82" y="290" fill="#cbd5e1" font-size="28" font-weight="500">One-time codes &amp; PINs for SwiftUI</text>
    <g font-size="20" font-weight="600">
      <rect x="82" y="330" width="150" height="40" rx="20" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="157" y="357" fill="#e2e8f0" text-anchor="middle">SMS autofill</text>
      <rect x="244" y="330" width="120" height="40" rx="20" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="304" y="357" fill="#e2e8f0" text-anchor="middle">Swift 6</text>
      <rect x="376" y="330" width="96" height="40" rx="20" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="424" y="357" fill="#e2e8f0" text-anchor="middle">SPM</text>
    </g>

    <!-- Partially filled code with caret -->
    <g filter="url(#shadow)" font-size="40" font-weight="700" text-anchor="middle" fill="#ffffff">
      <rect x="690" y="120" width="72" height="88" rx="16" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.5"/>
      <text x="726" y="178">4</text>
      <rect x="776" y="120" width="72" height="88" rx="16" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.5"/>
      <text x="812" y="178">8</text>
      <rect x="862" y="120" width="72" height="88" rx="16" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.5"/>
      <text x="898" y="178">2</text>
      <rect x="948" y="120" width="72" height="88" rx="16" fill="url(#glass)" stroke="#2dd4bf" stroke-width="3"/>
      <rect x="982" y="144" width="4" height="40" rx="2" fill="#2dd4bf"/>
      <rect x="1034" y="120" width="72" height="88" rx="16" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>
      <rect x="1120" y="120" width="72" height="88" rx="16" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>
    </g>

    <!-- Secure PIN with underline style -->
    <g filter="url(#shadow)">
      <circle cx="770" cy="300" r="10" fill="#ffffff"/>
      <rect x="734" y="330" width="72" height="4" rx="2" fill="#ffffff" fill-opacity="0.8"/>
      <circle cx="870" cy="300" r="10" fill="#ffffff"/>
      <rect x="834" y="330" width="72" height="4" rx="2" fill="#ffffff" fill-opacity="0.8"/>
      <rect x="934" y="330" width="72" height="4" rx="2" fill="#818cf8"/>
      <rect x="1034" y="330" width="72" height="4" rx="2" fill="#ffffff" fill-opacity="0.35"/>
    </g>

    <!-- Error state -->
    <g filter="url(#shadow)" font-size="30" font-weight="700" text-anchor="middle" fill="#fca5a5">
      <rect x="720" y="392" width="60" height="72" rx="14" fill="#ef4444" fill-opacity="0.12" stroke="#f87171" stroke-width="2.5"/>
      <text x="750" y="439">1</text>
      <rect x="792" y="392" width="60" height="72" rx="14" fill="#ef4444" fill-opacity="0.12" stroke="#f87171" stroke-width="2.5"/>
      <text x="822" y="439">3</text>
      <rect x="864" y="392" width="60" height="72" rx="14" fill="#ef4444" fill-opacity="0.12" stroke="#f87171" stroke-width="2.5"/>
      <text x="894" y="439">5</text>
      <rect x="936" y="392" width="60" height="72" rx="14" fill="#ef4444" fill-opacity="0.12" stroke="#f87171" stroke-width="2.5"/>
      <text x="966" y="439">7</text>
      <text x="1060" y="440" font-size="22" font-weight="600" text-anchor="start" fill="#fca5a5">shake + haptic</text>
    </g>
  </g>
</svg>
